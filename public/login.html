<!DOCTYPE html>
<html>
<head>
    <title>Weight Slip System</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="login-box">

    <h1>Weight Slip System</h1>

    <p>Login to continue</p>

    <form action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>
</html>
